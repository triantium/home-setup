- hosts: localhost
  connection: local
  become: false
  vars:
    ansible_become: false
    ansible_user: "{{ lookup('env', 'USER') }}"
  gather_facts: false
  tasks:
    - name: Update local password store from remote
      ansible.builtin.command: pass git pull
      register: pass_pull
      changed_when: '"Already up to date" not in pass_pull.stdout'

- hosts:
    - netcup
  vars:
    immich_traefik_enabled: true
    immich_publish_port: false
    immich_domain: "{{ external_url }}"
    immich_hostname: "myndir.{{ external_url }}"
    immich_oidc_enabled: true
    immich_oidc_issuer_url: "https://auth.{{ external_url }}/realms/skillzinskullz"
    immich_oidc_client_id: immich
    immich_oidc_client_secret_location: "services/keycloak/auth.{{ external_url }}/immich"
    immich_oidc_client_secret: "{{ lookup('community.general.passwordstore', immich_oidc_client_secret_location, missing='create') }}"
    immich_smtp_enabled: true
    immich_smtp_host: "{{ lookup('community.general.passwordstore', 'accounts/mailbox.org', subkey='smtp') }}"
    immich_smtp_port: 465
    immich_smtp_username: "{{ lookup('community.general.passwordstore', 'accounts/mailbox.org', subkey='login') }}"
    immich_smtp_password: "{{ lookup('community.general.passwordstore', 'accounts/mailbox.org') }}"
    immich_smtp_from: "auth@{{ external_url }}"
    immich_smtp_reply_to: "auth@{{ external_url }}"
    immich_smtp_secure: true
    immich_smtp_ignore_cert: false
    immich_restic_host: myndir-immich
    autorestic_location_name: myndir-immich-backups
  roles:
    - role: docker-compose/traefik
    #- role: docker-compose/keycloak
    - role: docker-compose/immich
