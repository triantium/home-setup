- id: '1719482184159'
  alias: Divera alarm Light On
  description: ''
  use_blueprint:
    path: fwmarcel/divera-blueprint.yaml
    input:
      divera_sensor:
      - sensor.ffw_bertoldsheim_alarm
      target_action:
      - action: scene.create
        metadata: {}
        data:
          scene_id: bevor_alarm
          snapshot_entities:
          - light.deckenleuchte
          - light.hallway_lights
          - light.klo
          - light.kuche
          - switch.nachtlicht
          - light.essbereich
          - light.wohnbereich
          - light.h60a1
          - light.lena
          - light.bedroom_lights
          - light.wiz_rgbww_tunable_c481c6
          - light.livingroom_lights
          - light.wiz_rgbw_tunable_ef0718
      - metadata: {}
        data:
          brightness_pct: 100
        target:
          label_id: alarmlight
        action: light.turn_on
      - action: assist_satellite.announce
        metadata: {}
        data:
          preannounce: true
          message: 'Alarm. Meldung: {{ states.sensor.ffw_bertoldsheim_alarm.state
            }}'
        target:
          device_id: 0a4660d72a0bf44f0aad5dc907e006d9
      - delay:
          hours: 0
          minutes: 3
          seconds: 0
          milliseconds: 0
      - action: scene.turn_on
        metadata: {}
        data:
          transition: 120
        target:
          entity_id: scene.bevor_alarm
