- name: Authenticate to Keycloak
  uri:
    url: "https://{{ domain }}/realms/master/protocol/openid-connect/token"
    method: POST
    body_format: form-urlencoded
    body:
      username: "admin"
      password: "{{ keycloak_admin_password }}"
      grant_type: "password"
      client_id: "admin-cli"
    validate_certs: "{{ validate_certs | default(true) }}"
    status_code: [200]
    return_content: yes
  register: keycloak_auth_response
  retries: 3
  delay: 5

#- name: Show Login
#  ansible.builtin.debug:
#    msg: "{{ keycloak_auth_response.json.access_token }}"

- name: Get Realms
  retries: 10
  delay: 15
  uri:
    url: "https://{{domain}}/admin/realms"
    method: GET
    body_format: json
    headers:
      Authorization: "Bearer {{ keycloak_auth_response.json.access_token }}"
  register: keycloak_realms

#- name: Show Realms
#  ansible.builtin.debug:
#    msg: "{{ keycloak_realms.json }}"

- name: set Realm Name
  set_fact:
    realm_name: "{{ realm }}"

- name: Check if specific realm exists
  set_fact:
    realm_exists: "{{ keycloak_realms.json | selectattr('realm', 'equalto', realm_name) | list | length > 0 }}"

- name: Does Realm exist ?
  ansible.builtin.debug:
    msg: "{{realm_exists}}"

- name: Ensure temp directory exists
  file:
    path: "{{ temp_config_path }}"
    state: directory
    mode: '0755'
  when: not realm_exists

- name: Template the realm configuration file
  template:
    src: "{{ external_url }}/{{ realm_template_file }}"
    dest: "{{ temp_config_path }}/{{ realm }}.json"
  when: not realm_exists

- name: Read remote configuration file
  slurp:
    src: "{{ temp_config_path }}/{{ realm }}.json"
  register: realm_config
  when: not realm_exists

- name: Create realm from file if it doesn't exist
  uri:
    url: "https://{{ domain }}/admin/realms"
    method: POST
    headers:
      Authorization: "Bearer {{ keycloak_auth_response.json.access_token }}"
    body: "{{ realm_config['content'] | b64decode | from_json }}"
    body_format: json
    status_code: [201,409] # Assume 409 Conflict means we already created it
  when: not realm_exists
  register: realm_creation_result

- name: Cleanup templated config file
  file:
    path: "{{ temp_config_path }}/geekinbusiness.json"
    state: absent
  when: not realm_exists

- name: Debug realm creation
  debug:
    msg: "Realm creation status: {{ realm_creation_result }}"
  when: not realm_exists

- name: Authenticate to Keycloak for LDAP federation setup
  uri:
    url: "https://{{ domain }}/realms/master/protocol/openid-connect/token"
    method: POST
    body_format: form-urlencoded
    body:
      username: "admin"
      password: "{{ keycloak_admin_password }}"
      grant_type: "password"
      client_id: "admin-cli"
    validate_certs: "{{ validate_certs | default(true) }}"
    status_code: [200]
  register: keycloak_federation_auth
  retries: 3
  delay: 5

- name: Get realm details
  uri:
    url: "https://{{ domain }}/admin/realms/{{ realm }}"
    method: GET
    headers:
      Authorization: "Bearer {{ keycloak_federation_auth.json.access_token }}"
    status_code: [200]
  register: keycloak_realm_details

- name: Get user federation providers of the realm
  uri:
    url: "https://{{ domain }}/admin/realms/{{ realm }}/components?type=org.keycloak.storage.UserStorageProvider"
    method: GET
    headers:
      Authorization: "Bearer {{ keycloak_federation_auth.json.access_token }}"
    status_code: [200]
  register: keycloak_user_federation_providers

- name: Find existing LDAP user federation provider
  set_fact:
    keycloak_ldap_component: "{{ keycloak_user_federation_providers.json | selectattr('name', 'equalto', keycloak_ldap_provider_name) | list | first | default({}) }}"

- name: Create LDAP user federation provider
  uri:
    url: "https://{{ domain }}/admin/realms/{{ realm }}/components"
    method: POST
    headers:
      Authorization: "Bearer {{ keycloak_federation_auth.json.access_token }}"
    body_format: json
    body:
      name: "{{ keycloak_ldap_provider_name }}"
      providerId: ldap
      providerType: org.keycloak.storage.UserStorageProvider
      parentId: "{{ keycloak_realm_details.json.id }}"
      config: "{{ keycloak_ldap_config }}"
    status_code: [201]
  when: keycloak_ldap_component | length == 0

- name: Update LDAP user federation provider
  uri:
    url: "https://{{ domain }}/admin/realms/{{ realm }}/components/{{ keycloak_ldap_component.id }}"
    method: PUT
    headers:
      Authorization: "Bearer {{ keycloak_federation_auth.json.access_token }}"
    body_format: json
    body:
      id: "{{ keycloak_ldap_component.id }}"
      name: "{{ keycloak_ldap_provider_name }}"
      providerId: ldap
      providerType: org.keycloak.storage.UserStorageProvider
      parentId: "{{ keycloak_realm_details.json.id }}"
      config: "{{ keycloak_ldap_config }}"
    status_code: [204]
  when: keycloak_ldap_component | length > 0

- name: Install required LDAP packages
  apt:
    name:
      - python3-pip
      - python3-ldap
      - libldap2-dev
      - libsasl2-dev
      - ldap-utils
      - python3-dev
      - gcc
    state: present

- name: Wait for ldap-Port
  ansible.builtin.wait_for:
    port: 389
    sleep: 5

- name: Ensure LDAP users organizational unit exists
  community.general.ldap_entry:
    dn: "ou=users,{{ ldap_base_dn }}"
    objectClass:
      - top
      - organizationalUnit
    attributes:
      ou: users
    server_uri: "ldap://localhost:389"
    bind_dn: "{{ ldap_admin_dn }}"
    bind_pw: "{{ ldap_admin_password }}"
    state: present

- name: Ensure LDAP groups organizational unit exists
  community.general.ldap_entry:
    dn: "ou=groups,{{ ldap_base_dn }}"
    objectClass:
      - top
      - organizationalUnit
    attributes:
      ou: groups
    server_uri: "ldap://localhost:389"
    bind_dn: "{{ ldap_admin_dn }}"
    bind_pw: "{{ ldap_admin_password }}"
    state: present

- name: Create Keycloak users
  ansible.builtin.include_tasks:
    file: keycloak-users.yml

- name: Configure Keycloak OIDC client for Immich
  ansible.builtin.include_tasks:
    file: keycloak-oidc-client.yml
  when: immich_oidc_enabled | default(false)
