- name: Authenticate to Keycloak for user {{ keycloak_user.username }}
  uri:
    url: "https://{{ domain }}/realms/master/protocol/openid-connect/token"
    method: POST
    body_format: form-urlencoded
    body:
      username: "admin"
      password: "{{ keycloak_admin_password }}"
      grant_type: "password"
      client_id: "admin-cli"
    validate_certs: "{{ validate_certs | default(true) }}"
    status_code: [200]
  register: keycloak_user_auth
  retries: 3
  delay: 5

- name: Look up user {{ keycloak_user.username }}
  uri:
    url: "https://{{ domain }}/admin/realms/{{ realm }}/users?username={{ keycloak_user.username | urlencode }}&exact=true"
    method: GET
    headers:
      Authorization: "Bearer {{ keycloak_user_auth.json.access_token }}"
    status_code: [200]
  register: keycloak_user_lookup

- name: Create user {{ keycloak_user.username }}
  uri:
    url: "https://{{ domain }}/admin/realms/{{ realm }}/users"
    method: POST
    headers:
      Authorization: "Bearer {{ keycloak_user_auth.json.access_token }}"
    body_format: json
    body:
      username: "{{ keycloak_user.username }}"
      email: "{{ keycloak_user.email }}"
      firstName: "{{ keycloak_user.first_name }}"
      lastName: "{{ keycloak_user.last_name }}"
      enabled: "{{ keycloak_user.enabled }}"
    status_code: [201]
  when: keycloak_user_lookup.json | length == 0
  register: keycloak_user_creation

- name: Determine Keycloak user ID for {{ keycloak_user.username }}
  set_fact:
    keycloak_user_id: >-
      {{ (keycloak_user_lookup.json | first).id if keycloak_user_lookup.json | length > 0
         else (keycloak_user_creation.location | urlsplit('path')).split('/')[-1] }}

- name: Update user profile for {{ keycloak_user.username }}
  uri:
    url: "https://{{ domain }}/admin/realms/{{ realm }}/users/{{ keycloak_user_id }}"
    method: PUT
    headers:
      Authorization: "Bearer {{ keycloak_user_auth.json.access_token }}"
    body_format: json
    body:
      id: "{{ keycloak_user_id }}"
      username: "{{ keycloak_user.username }}"
      email: "{{ keycloak_user.email }}"
      firstName: "{{ keycloak_user.first_name }}"
      lastName: "{{ keycloak_user.last_name }}"
      enabled: "{{ keycloak_user.enabled }}"
    status_code: [204]

- name: Set password for {{ keycloak_user.username }}
  uri:
    url: "https://{{ domain }}/admin/realms/{{ realm }}/users/{{ keycloak_user_id }}/reset-password"
    method: PUT
    headers:
      Authorization: "Bearer {{ keycloak_user_auth.json.access_token }}"
    body_format: json
    body:
      type: password
      value: "{{ keycloak_user.password }}"
      temporary: false
    status_code: [204]
  no_log: true

- name: Assign realm roles to {{ keycloak_user.username }}
  uri:
    url: "https://{{ domain }}/admin/realms/{{ realm }}/users/{{ keycloak_user_id }}/role-mappings/realm"
    method: POST
    headers:
      Authorization: "Bearer {{ keycloak_user_auth.json.access_token }}"
    body_format: json
    body: "{{ keycloak_realm_roles.json | selectattr('name', 'in', keycloak_user.roles | default([]) | map(attribute='role') | list) | list }}"
    status_code: [204]
  when: keycloak_user.roles is defined and keycloak_user.roles | length > 0
