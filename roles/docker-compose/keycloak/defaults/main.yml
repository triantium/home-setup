domain: auth.{{ external_url }}
deployment_dir: /opt/{{ external_url }}/keycloak
password_location: "services/keycloak/{{ domain }}/admin"
keycloak_admin_password: "{{ lookup('community.general.passwordstore', password_location , missing='create' ) }}"
temp_config_path: "/tmp/keycloak/{{domain}}"
realm: "skillzinskullz"
realm_template_file: "skillzinskullz.json.j2"

ldap_domain_name: ldap.{{ external_url }}
ldap_base_dn: "dc=skillzinskullz,dc=de"
ldap_admin_dn: "cn=admin,{{ ldap_base_dn }}"
ldap_password_location: "services/ldap/{{ ldap_domain_name }}/admin"
ldap_admin_password: "{{ lookup('community.general.passwordstore', ldap_password_location, missing='create') }}"

# Email Einstellungen
email_password_location: "accounts/mailbox.org"
smtp_host: "{{ lookup('community.general.passwordstore', email_password_location , subkey='smtp' ) }}"
smtp_port: 465
smtp_from: auth@{{external_url}}
smtp_username: "{{ lookup('community.general.passwordstore', email_password_location , subkey='login' ) }}"
smtp_password: "{{ lookup('community.general.passwordstore', email_password_location ) }}"

postgres_password_location: 'hosts/{{ansible_facts.hostname}}/services/postgres/{{ external_url }}'
postgres_database_password: "{{ lookup('community.general.passwordstore', postgres_password_location, missing='create') }}"

keycloak_database_password_location: "services/databases/{{ external_url }}/postgres/keycloak"
keycloak_db_name: keycloak
keycloak_db_user: keycloak
keycloak_db_password: "{{ lookup('community.general.passwordstore', keycloak_database_password_location , missing='create' ) }}"
keycloak_db_url_host: postgres

users:
  - username: manuel
    password: "{{ lookup('community.general.passwordstore', 'accounts/auth.skillzinskullz/manuel', missing='create') }}"
    email: manuel@triantium.de
    first_name: Manuel
    last_name: Müller
    enabled: true
    roles:
      - realm: skillzinskullz
        role: admin
  - username: manuela
    password: "{{ lookup('community.general.passwordstore', 'accounts/auth.skillzinskullz/manuela', missing='create') }}"
    email: manuela@triantium.de
    first_name: Manuela
    last_name: ---
    enabled: true
    roles:
      - realm: skillzinskullz
        role: user
