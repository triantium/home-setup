service_name: immich
uri: myndir.triantium.de
domain: triantium.ddns.net

immich_port: 2283
immich_tz: Europe/Berlin

immich_data_dir: /opt/{{ domain }}/immich
immich_upload_location: "{{ immich_data_dir }}/library"
immich_db_data_location: "{{ immich_data_dir }}/postgres"
immich_db_username: immich
immich_db_database_name: immich
immich_db_password_location: 'hosts/{{ ansible_facts.hostname }}/services/immich/{{ domain }}'
immich_db_password: "{{ lookup('community.general.passwordstore', immich_db_password_location, missing='create') }}"

# Read-only media library that is registered as an external library in the web UI
immich_external_library_dir: /share/homes/pi/immich

immich_healthcheck_port: "{{ immich_port }}"

autorestic_location_name: immich-backups
autorestic_cron_minute: "{{ 60 | random(seed=inventory_hostname + '_' + service_name + '_cron_min') }}"
autorestic_cron_hour: "{{ 24 | random(seed=inventory_hostname + '_' + service_name + '_cron_hour') }}"
autorestic_cron: "{{ autorestic_cron_minute }} {{ autorestic_cron_hour }} * * *"
