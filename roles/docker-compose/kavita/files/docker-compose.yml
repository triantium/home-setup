services:
  kavita:
    image: ghcr.io/kareadita/kavita:latest
    container_name: kavita
    ports:
      - "${KAVITA_PORT:-5000}:5000"
    restart: unless-stopped
    environment:
      - TZ=${KAVITA_TZ:-Europe/Berlin}
    env_file:
      - .env
    volumes:
      - ${KAVITA_CONFIG_DIR}:/kavita/config
      - ${KAVITA_MANGA_DIR}:/manga
      - ${KAVITA_COMICS_DIR}:/comics
      - ${KAVITA_BOOKS_DIR}:/books
    healthcheck:
      test: ["CMD-SHELL", "wget -q http://localhost:5000 -O /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
