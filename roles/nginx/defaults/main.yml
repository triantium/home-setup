  - restic.triantium.ddns.net
  - miniflux.triantium.ddns.net
  - navidrome.triantium.ddns.net
  - kavita.triantium.ddns.net
  - paperless.triantium.ddns.net
  - git.triantium.ddns.net
  - myndir.triantium.de
