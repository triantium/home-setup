# Dedicated vhost for Immich.
#
# Immich does not support being served from a sub-path such as
# `location /immich {`. It has to be served from the root of its own hostname,
# so this is a full server block instead of a location fragment like the other
# services in this directory.
#
# Requires the certificate issued for this hostname by the "Obtain
# certificate" task in roles/nginx/tasks/setup-domain.yml. On the first run the
# SSL directives are commented out, plain HTTP is served, the certificate is
# issued and the directives are restored.
#
# See https://docs.immich.app/administration/reverse-proxy

server
{
  listen 443 ssl http2;
  listen [::]:443 ssl http2;

  server_name myndir.triantium.de;

  # SSL
  ssl_certificate /etc/letsencrypt/live/myndir.triantium.de/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/myndir.triantium.de/privkey.pem;
  ssl_trusted_certificate /etc/letsencrypt/live/myndir.triantium.de/chain.pem;

  # security
  include nginxconfig.io/security.conf;

  # allow large uploads
  client_max_body_size 50000M;

  # disable buffering uploads to prevent OOM and make uploads faster
  proxy_request_buffering off;

  # increase body buffer to avoid limiting upload speed
  client_body_buffer_size 1024k;

  proxy_redirect off;

  # generous timeouts for video transcoding and large uploads
  proxy_read_timeout 600s;
  proxy_send_timeout 600s;
  send_timeout 600s;

  location /
  {
    proxy_pass http://192.168.19.35:2283;

    # enable websockets
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    include nginxconfig.io/proxy.conf;
  }

  # additional config
  include nginxconfig.io/general.conf;
}

# Keep the hostname stable when it is entered over plain HTTP, so that the
# redirect does not drop users off on the apex domain. The ACME challenge is
# served from here, which lets certbot renew this certificate.
server
{
  listen 80;
  listen [::]:80;

  server_name myndir.triantium.de;

  include nginxconfig.io/letsencrypt.conf;

  location /
  {
    return 301 https://myndir.triantium.de$request_uri;
  }
}
